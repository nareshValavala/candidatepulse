<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>CandidatePulse — Prototype</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet" />
<style>
  * { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; }
  body { background: #F4F6F9; font-family: 'IBM Plex Sans', system-ui, sans-serif; -webkit-font-smoothing: antialiased; text-rendering: optimizeLegibility; }
  #root { min-height: 100vh; }
  button { font-family: inherit; }
  input { font-family: inherit; }
  input:focus { border-color: #0F1F3D !important; box-shadow: 0 0 0 3px rgba(15,31,61,.08); }
  ::-webkit-scrollbar { width: 9px; height: 9px; }
  ::-webkit-scrollbar-thumb { background: rgba(100,116,139,.32); border-radius: 99px; }
  ::-webkit-scrollbar-track { background: transparent; }
  .rs-row:hover { background: #F8FAFC !important; }
  .rs-card-hover { transition: transform .15s ease, box-shadow .15s ease; }
  .rs-card-hover:hover { transform: translateY(-2px); box-shadow: 0 12px 30px -14px rgba(15,31,61,.25); }
  @keyframes rsPulse { 0% { transform: scale(1); opacity: .4; } 100% { transform: scale(2.4); opacity: 0; } }
  @keyframes rsRipple { 0% { transform: scale(.7); opacity: .5; } 100% { transform: scale(1.25); opacity: 0; } }
  @keyframes rsRise { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: translateY(0); } }
  @keyframes rsFade { from { opacity: 0; } to { opacity: 1; } }
  @keyframes rsBlink { 50% { opacity: 0; } }
  @keyframes rsWave { 0%, 100% { transform: scaleY(.5); } 50% { transform: scaleY(1); } }
  @media (prefers-reduced-motion: reduce) { * { animation: none !important; } }
</style>
</head>
<body>

</svg>
